<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spires Jobs</title>
  <meta name="description" content="Private Spires Taxis family jobs calendar">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#002147">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spires Jobs">
  <link rel="icon" href="/images/office-jobs-192.png">
  <link rel="apple-touch-icon" href="/images/office-jobs-192.png">
  <link rel="manifest" href="/office-jobs-manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@0,9..40,400;0,9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/office-jobs.css?v=3">
</head>
<body>
  <div id="pin-screen" class="screen">
    <img src="/images/spireslogo.svg" alt="Spires Taxis" class="logo">
    <h1>Family jobs</h1>
    <p class="lede">Enter the shared PIN once. This phone stays signed in.</p>
    <form id="pin-form">
      <label>
        PIN
        <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="one-time-code" required>
      </label>
      <p id="pin-error" class="error" hidden></p>
      <button type="submit" class="btn btn-primary" id="pin-submit">Continue</button>
    </form>
  </div>

  <div id="app-screen" class="screen" hidden>
    <header class="top">
      <div>
        <p class="kicker">Spires Taxis</p>
        <h1>Jobs</h1>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="Job views">
      <button type="button" class="is-active" data-view="today">Today</button>
      <button type="button" data-view="tomorrow">Tomorrow</button>
      <button type="button" data-view="upcoming">Upcoming jobs</button>
      <button type="button" data-view="completed">Completed jobs</button>
    </div>

    <p id="app-status" class="ok" hidden></p>
    <p id="app-error" class="error" hidden></p>
    <p id="app-empty" class="empty" hidden>No jobs in this view.</p>
    <ul id="job-list" class="job-list"></ul>

    <button type="button" id="add-job" class="fab">Add job</button>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" id="sheet-card"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-functions-compat.js"></script>
  <script src="/js/office-jobs.js?v=4"></script>
</body>
</html>
