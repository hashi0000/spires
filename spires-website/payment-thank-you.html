<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#10233d">
  <title>Thank you for your payment | Spires Taxis</title>
  <link rel="icon" href="/images/spireslogo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/payment-thank-you.css">
</head>
<body>
  <main class="payment-page">
    <a class="payment-brand" href="/" aria-label="Spires Taxis home">
      <img src="/images/spireslogo.svg" alt="Spires Taxis" width="280" height="60">
    </a>
    <section class="payment-card" aria-labelledby="payment-title">
      <span class="payment-check" aria-hidden="true"></span>
      <h1 id="payment-title">Thank you for your payment</h1>
      <p>Thank you for choosing Spires Taxis. If you paid a deposit, it will be deducted from your total fare.</p>
      <div class="payment-actions">
        <a class="payment-button" href="https://customer.spires-taxis.com/">Customer Portal</a>
        <a class="payment-link" href="/">Back to Spires Taxis</a>
      </div>
      <footer>
        <p>Need a receipt or help with your booking?</p>
        <a href="mailto:bookings@spires-taxis.com">Email us</a>
        <a href="https://wa.me/447776897772">WhatsApp us</a>
      </footer>
    </section>
  </main>
</body>
</html>
