<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Spires Taxis Oxford</title>
    <meta name="description" content="Secure staff login for Spires Taxis Oxford operations.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.spires-taxis.com/login.html">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --oxford-blue: #002147;
            --oxford-gold: #C5A572;
            --oxford-cream: #F7F4E9;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--oxford-blue) 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }


        .login-container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }


        .logo {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--oxford-blue);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }


        .subtitle {
            color: var(--oxford-gold);
            font-weight: 500;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }


        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }


        .form-label {
            display: block;
            color: var(--oxford-blue);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }


        .form-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8fafc;
        }


        .form-input:focus {
            outline: none;
            border-color: var(--oxford-blue);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 33, 71, 0.1);
        }


        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--oxford-blue) 0%, #1e3a8a 100%);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }


        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 33, 71, 0.3);
        }


        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }


        .back-link {
            display: inline-block;
            color: var(--oxford-gold);
            text-decoration: none;
            margin-top: 1.5rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }


        .back-link:hover {
            color: var(--oxford-blue);
        }


        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }


        .security-note {
            background: #f0f9ff;
            color: #0c4a6e;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            border-left: 4px solid var(--oxford-blue);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="logo">Spires Taxis</h1>
        <p class="subtitle">Admin Dashboard Access</p>
       
        <div id="error-message" class="error-message">
            Invalid username or password. Please try again.
        </div>
       
        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-input" required autocomplete="username">
            </div>
           
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" required autocomplete="current-password">
            </div>
           
            <button type="submit" class="login-btn" id="login-button">
                Access Dashboard
            </button>
        </form>
       
        <a href="index.html" class="back-link">← Back to Website</a>
       
        <div class="security-note">
            <strong>🔒 Secure Access</strong><br>
            This area is restricted to authorized personnel only.
        </div>
    </div>


    <script>
        // Simple login credentials (IN PRODUCTION, NEVER DO THIS!)
        // This is just for demonstration - use proper backend authentication
        const ADMIN_CREDENTIALS = {
            /*'admin': 'spires2024',
            'spiresadmin': 'oxford123'*/
            'h.shah': 'LLmp4021!',
            'z.shah': 'Littleeid05'
        };


        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
           
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            const loginButton = document.getElementById('login-button');
           
            // Disable button during login attempt
            loginButton.disabled = true;
            loginButton.textContent = 'Checking...';
           
            // Simulate checking credentials (add delay for realism)
            setTimeout(() => {
                if (ADMIN_CREDENTIALS[username] && ADMIN_CREDENTIALS[username] === password) {
                    // Success - store login state and redirect
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    sessionStorage.setItem('adminUser', username);
                    window.location.href = './admin/';
                } else {
                    // Failed login
                    errorMessage.style.display = 'block';
                    loginButton.disabled = false;
                    loginButton.textContent = 'Access Dashboard';
                   
                    // Clear password field
                    document.getElementById('password').value = '';
                   
                    // Hide error after 3 seconds
                    setTimeout(() => {
                        errorMessage.style.display = 'none';
                    }, 3000);
                }
            }, 1000);
        });


        // Hide error message when user starts typing
        document.getElementById('username').addEventListener('input', function() {
            document.getElementById('error-message').style.display = 'none';
        });
       
        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('error-message').style.display = 'none';
        });
    </script>
</body>
</html>
